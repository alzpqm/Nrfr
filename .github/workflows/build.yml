name: Publish signed Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/android.yml

  release:
    needs: checks
    if: github.repository == 'alzpqm/Nrfr' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - run: sdkmanager 'build-tools;37.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: nrfr-android-release-unsigned
          path: apk
      - name: Prepare release metadata
        shell: bash
        run: |
          nrfr_version=$(python3 -c 'import pathlib,re; print(re.search(r"versionName = \"([^\"]+)\"", pathlib.Path("app/build.gradle.kts").read_text()).group(1))')
          if ! [[ "$nrfr_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "候選版不得由正式發布流程設為最新版；請先完成裝置驗證。"
            exit 1
          fi
          test -f "docs/releases/${nrfr_version}.md"
          echo "NRFR_RELEASE_VERSION=${nrfr_version}" >> "$GITHUB_ENV"
          echo "NRFR_RELEASE_TAG=v${nrfr_version}" >> "$GITHUB_ENV"
      - name: Sign release APK
        shell: bash
        env:
          NRFR_RELEASE_KEYSTORE_BASE64: ${{ secrets.NRFR_RELEASE_KEYSTORE_BASE64 }}
          NRFR_RELEASE_STORE_PASSWORD: ${{ secrets.NRFR_RELEASE_STORE_PASSWORD }}
          NRFR_RELEASE_KEY_PASSWORD: ${{ secrets.NRFR_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$NRFR_RELEASE_KEYSTORE_BASE64" && test -n "$NRFR_RELEASE_STORE_PASSWORD" && test -n "$NRFR_RELEASE_KEY_PASSWORD" || {
            echo "請依 docs/release-signing.md 設定固定發布簽章；不會用 debug 簽章替代。"
            exit 1
          }
          umask 077
          nrfr_signing_dir=$(mktemp -d "$RUNNER_TEMP/nrfr-signing.XXXXXX")
          trap 'rm -rf "$nrfr_signing_dir"' EXIT
          printf '%s' "$NRFR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$nrfr_signing_dir/nrfr-release.p12"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -P 16 -f 4 apk/app-release-unsigned.apk "$nrfr_signing_dir/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$nrfr_signing_dir/nrfr-release.p12" --ks-key-alias nrfr-release \
            --ks-pass env:NRFR_RELEASE_STORE_PASSWORD --key-pass env:NRFR_RELEASE_KEY_PASSWORD \
            --v4-signing-enabled false --out "nrfr-${NRFR_RELEASE_VERSION}-release.apk" "$nrfr_signing_dir/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "nrfr-${NRFR_RELEASE_VERSION}-release.apk"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "nrfr-${NRFR_RELEASE_VERSION}-release.apk"
          sha256sum "nrfr-${NRFR_RELEASE_VERSION}-release.apk" > SHA256SUMS
      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$NRFR_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "版本已發布；保留原有 APK，不覆蓋已發布的檔案。"
            exit 1
          fi
          gh release create "$NRFR_RELEASE_TAG" "nrfr-${NRFR_RELEASE_VERSION}-release.apk" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Nrfr ${NRFR_RELEASE_VERSION} — 正式版" --notes-file "docs/releases/${NRFR_RELEASE_VERSION}.md"
          gh release edit "$NRFR_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
