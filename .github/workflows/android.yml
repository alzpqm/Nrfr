name: Android checks

on:
  push:
    branches: [master, 'fix/**', 'codex/s25-apn-fix']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nrfr-client/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nrfr-client/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Summarize unit tests
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, pathlib, xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")]
          counts = {key: sum(int(r.attrib.get(key, 0)) for r in reports) for key in ("tests", "failures", "errors", "skipped")}
          assert counts["tests"] > 0 and counts["failures"] == counts["errors"] == counts["skipped"] == 0, counts
          suites = {r.attrib["name"] for r in reports}
          assert {"com.github.nrfr.manager.CarrierApplyCoordinatorTest", "com.github.nrfr.manager.CarrierRestoreCoordinatorTest", "com.github.nrfr.manager.LegacyApnCleanupCoordinatorTest"} <= suites, suites
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"Android unit tests: {counts['tests']} passed. Lint and debug/release builds completed.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrfr-android-check-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
      - uses: actions/upload-artifact@v4
        with:
          name: nrfr-android17-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nrfr-android-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  signed-diagnostic-candidate:
    needs: android
    if: github.repository == 'alzpqm/Nrfr' && github.ref == 'refs/heads/codex/s25-apn-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - run: sdkmanager 'build-tools;37.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: nrfr-android-release-unsigned
          path: apk
      - name: Sign with the existing release certificate
        shell: bash
        env:
          NRFR_RELEASE_KEYSTORE_BASE64: ${{ secrets.NRFR_RELEASE_KEYSTORE_BASE64 }}
          NRFR_RELEASE_STORE_PASSWORD: ${{ secrets.NRFR_RELEASE_STORE_PASSWORD }}
          NRFR_RELEASE_KEY_PASSWORD: ${{ secrets.NRFR_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$NRFR_RELEASE_KEYSTORE_BASE64" && test -n "$NRFR_RELEASE_STORE_PASSWORD" && test -n "$NRFR_RELEASE_KEY_PASSWORD" || {
            echo 'Existing release key is unavailable; no substitute will be generated.'
            exit 1
          }
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/nrfr-candidate.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$NRFR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/nrfr-release.p12"
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -P 16 -f 4 apk/app-release-unsigned.apk "$signing_dir/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$signing_dir/nrfr-release.p12" --ks-key-alias nrfr-release \
            --ks-pass env:NRFR_RELEASE_STORE_PASSWORD --key-pass env:NRFR_RELEASE_KEY_PASSWORD \
            --v4-signing-enabled false --out nrfr-s25-diagnostic.apk "$signing_dir/aligned.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs nrfr-s25-diagnostic.apk |
            grep -i '64f5cde8ff7b2e5a1496941249c9c0c355744936fb6b11f19bbc65ac3830e469'
      - uses: actions/upload-artifact@v4
        with:
          name: nrfr-s25-signed-diagnostic-candidate
          path: nrfr-s25-diagnostic.apk
          retention-days: 2
